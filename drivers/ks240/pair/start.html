<script>
  let discoveredDevices = [];
  let globalCredentialsConfigured = false;

  Homey.setTitle(__('pair.start.title'));

  function setLoading(isLoading) {
    $('#startdiscovery').toggleClass('is-loading', isLoading);
    $('#saveSettings').toggleClass('is-loading', isLoading);
  }

  function getCredentialFields() {
    return {
      deviceUsername: document.getElementById('deviceUsername').value.trim(),
      devicePassword: document.getElementById('devicePassword').value
    };
  }

  function validateCredentialFields() {
    const credentials = getCredentialFields();
    const hasInput = credentials.deviceUsername.length > 0 || credentials.devicePassword.length > 0;
    if (hasInput && (!credentials.deviceUsername || !credentials.devicePassword)) {
      Homey.alert(__('pair.start.credentialsComplete'), 'error');
      return null;
    }
    if (!globalCredentialsConfigured && !hasInput) {
      Homey.alert(__('pair.start.credentialsRequired'), 'error');
      return null;
    }
    return credentials;
  }

  function showPairingError(error) {
    setLoading(false);
    Homey.alert(error && error.message ? error.message : __('pair.start.error'), 'error');
  }

  function updateCredentialStatus(status) {
    globalCredentialsConfigured = Boolean(status && status.configured);
    const hint = status && status.usernameHint ? status.usernameHint : '';
    document.getElementById('credentialStatus').textContent = globalCredentialsConfigured
      ? __('pair.start.globalCredentials', { username: hint })
      : __('pair.start.credentialsRequired');
  }

  $('#startdiscovery').on('click', function () {
    const credentials = validateCredentialFields();
    if (!credentials) return;
    setLoading(true);
    document.getElementById('discovery').style.display = 'block';
    discoveredDevices = [];
    Homey.emit('discover', credentials).catch(showPairingError);
  });

  Homey.on('continue', function () {
    Homey.showView('list_devices');
  });

  Homey.on('discovered_devices', function (devices) {
    setLoading(false);
    discoveredDevices = devices;
    const list = document.getElementById('deviceList');
    list.innerHTML = '';
    discoveredDevices.forEach(device => {
      const item = document.createElement('div');
      item.textContent = device.name + ' (' + device.ip + ')';
      list.appendChild(item);
    });
    document.getElementById('manualEntry').style.display = 'none';
  });

  Homey.on('discovery_failed', function () {
    setLoading(false);
    document.getElementById('discovery').style.display = 'none';
    Homey.alert(__('pair.start.nodevice'), 'error');
  });

  function saveSettings() {
    const credentials = validateCredentialFields();
    if (!credentials) return;
    setLoading(true);

    if (discoveredDevices.length > 0) {
      Homey.emit('get_devices', discoveredDevices.map(device => ({
        ...device,
        settings: {
          ...(device.settings || {}),
          ...credentials
        }
      }))).catch(showPairingError);
      return;
    }

    const ip = document.getElementById('ipAddress').value.trim();
    const ipv4 = /^(([01]?\d\d?|2[0-4]\d|25[0-5]).){3}([01]?\d\d?|2[0-4]\d|25[0-5])$/;
    if (!ipv4.test(ip)) {
      setLoading(false);
      Homey.alert(__('pair.start.invalidIP'), 'error');
      return;
    }
    Homey.emit('get_devices', [{ ip, ...credentials }]).catch(showPairingError);
  }
</script>

<div id="discovery" style="display: none">
  <p data-i18n="pair.start.discovery"></p>
  <div id="deviceList"></div>
</div>

<div id="manualEntry">
  <p><span data-i18n="pair.start.intro"></span></p>
  <p><button class="homey-button-small" id="startdiscovery"><span data-i18n="pair.start.startdiscovery"></span></button></p>
  <table class="pairSettings">
    <tr><td style="width:100px;"><span data-i18n="pair.start.ipAddress"></span></td><td><input id="ipAddress" type="text" placeholder="192.168.1.10" /></td></tr>
  </table>
</div>

<div id="authEntry">
  <p id="credentialStatus" data-i18n="pair.start.credentialsRequired"></p>
  <p data-i18n="pair.start.credentialsOverrideHint"></p>
  <table class="pairSettings">
    <tr><td style="width:100px;"><span data-i18n="pair.start.tpLinkEmail"></span></td><td><input id="deviceUsername" type="text" data-i18n="[placeholder]pair.start.tpLinkEmailPlaceholder" /></td></tr>
    <tr><td style="width:100px;"><span data-i18n="pair.start.tpLinkPassword"></span></td><td><input id="devicePassword" type="password" data-i18n="[placeholder]pair.start.tpLinkPasswordPlaceholder" /></td></tr>
  </table>
</div>

<fieldset><button class="homey-button-primary-full" id="saveSettings" onclick="saveSettings()"><span data-i18n="pair.start.saveSettings"></span></button></fieldset>
<script>
  Homey.emit('get_credential_status')
    .then(updateCredentialStatus)
    .catch(() => updateCredentialStatus({ configured: false }));
</script>
